name: 纳指100公开渠道实况雷达

on:
  schedule:
    # 工作日 08:00–22:30（北京时间）每 30 分钟巡检一次。
    # GitHub Actions 使用 UTC：00:00–14:30 UTC 对应北京时间 08:00–22:30。
    - cron: "0,30 0-14 * * 1-5"
  workflow_dispatch:
    inputs:
      force_digest:
        description: "立即发送一条完整汇总（首次测试可开启）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: nasdaq100-public-channel-radar
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出项目文件
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查天天基金公开交易页并生成推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FORCE_DIGEST: ${{ inputs.force_digest }}
        run: |
          if [ "${FORCE_DIGEST}" = "true" ]; then
            python src/main.py --force-digest
          else
            python src/main.py
          fi

      - name: 保存最新渠道状态
        run: |
          if git diff --quiet -- state/last_snapshot.json; then
            echo "状态未变化，无需提交。"
            exit 0
          fi
          git config user.name "nasdaq100-public-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_snapshot.json
          git commit -m "chore: update public channel snapshot"
          # 运行期间若 main 有新提交，先将快照提交重放到最新 main，避免推送冲突。
          git pull --rebase origin main
          git push origin HEAD:main
