name: 纳指100代销额度雷达

on:
  workflow_dispatch:
    inputs:
      force_digest:
        description: "立即发送一条完整日报（用于首次测试）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: nasdaq100-quota-radar
  cancel-in-progress: false

jobs:
  monitor:
    # 暂停原因：公开基金公告不能可靠反映支付宝的实时在售/预约状态。
    # 在接入支付宝实时数据源前，禁止该工作流发送任何消息。
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出项目文件
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查公告并生成推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FORCE_DIGEST: ${{ inputs.force_digest }}
        run: |
          if [ "${FORCE_DIGEST}" = "true" ]; then
            python src/main.py --force-digest
          else
            python src/main.py
          fi

      - name: 保存最新状态
        run: |
          if git diff --quiet -- state/last_snapshot.json; then
            echo "状态未变化，无需提交。"
            exit 0
          fi
          git config user.name "nasdaq100-quota-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_snapshot.json
          git commit -m "chore: update quota snapshot"
          # 运行期间仓库可能被手动更新或被接口更新；先以远端 main 为基线
          # 重放本次只改快照的提交，避免 non-fast-forward 导致整个任务失败。
          git pull --rebase origin main
          git push origin HEAD:main

